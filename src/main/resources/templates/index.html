<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>

<canvas id="matrix"></canvas>

<nav th:replace="~{fragments/layout :: nav('home')}"></nav>

<main class="page-content" th:if="${profile}">

    <section class="hero">
        <div class="hero-avatar-wrap">
            <img th:src="@{/images/profile.jpg}" alt="Profile" class="hero-avatar"/>
        </div>
        <div class="hero-text">
            <h1 th:text="${profile.fullName}">Your Name</h1>
            <h2 th:text="${profile.title}">Title</h2>

            <!-- TYPEWRITER -->
            <p class="hero-typewriter">
                <span id="typewriter"></span><span class="typewriter-caret">|</span>
            </p>

            <p class="hero-summary" th:text="${profile.summary}">Summary</p>
            <div class="hero-actions">
                <a th:href="@{/projects}" class="btn-primary">view projects →</a>
                <a th:href="@{/contact}"  class="btn-ghost">get in touch</a>
            </div>
        </div>
    </section>

    <section class="quick-links">
        <a th:href="@{/about}" class="quick-card">
            <span class="quick-icon">📖</span>
            <span class="quick-title">about</span>
            <span class="quick-desc">Who I am, what I study, what drives me.</span>
        </a>
        <a th:href="@{/projects}" class="quick-card">
            <span class="quick-icon">⚙️</span>
            <span class="quick-title">projects</span>
            <span class="quick-desc">Things I've built and shipped.</span>
        </a>
        <a th:href="@{/skills}" class="quick-card">
            <span class="quick-icon">🛠️</span>
            <span class="quick-title">skills</span>
            <span class="quick-desc">Languages, frameworks, and tools.</span>
        </a>
    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/matrix.js}"></script>
<script>
(function () {
    const target = document.getElementById('typewriter');
    if (!target) return;

    const phrases = [
        "Hi, I'm Calistus Masinde Sirucha.",
        "I'm an IT student at Kaimosi Friends University.",
        "I'm the founder of CMSTechub.",
        "I build web applications.",
        "I set up secure networks.",
        "I repair computer hardware.",
        "I design and manage databases.",
        "I do cybersecurity & ethical hacking.",
        "I install and recover software.",
        "I tutor IT students.",
        "I recommend and set up cloud services.",
        "I configure email & business tools.",
        "I fix printers & peripherals.",
        "I do IT consultancy for small businesses.",
        "I back up and recover your data."
    ];

    let phraseIndex = 0;
    let charIndex = 0;
    let deleting = false;
    const TYPE_SPEED = 60;
    const DELETE_SPEED = 30;
    const PAUSE_BETWEEN = 2200;
    const PAUSE_BEFORE_TYPE = 500;

    function tick() {
        const phrase = phrases[phraseIndex];
        if (!deleting) {
            charIndex++;
            target.textContent = phrase.substring(0, charIndex);
            if (charIndex === phrase.length) {
                deleting = true;
                setTimeout(tick, PAUSE_BETWEEN);
                return;
            }
            setTimeout(tick, TYPE_SPEED);
        } else {
            charIndex--;
            target.textContent = phrase.substring(0, charIndex);
            if (charIndex === 0) {
                deleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                setTimeout(tick, PAUSE_BEFORE_TYPE);
                return;
            }
            setTimeout(tick, DELETE_SPEED);
        }
    }
    tick();
})();
</script>
<div th:replace="~{fragments/layout :: scrollButtons}"></div>
</body>
</html>
