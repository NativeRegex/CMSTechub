<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>

<canvas id="matrix"></canvas>

<nav th:replace="~{fragments/layout :: nav('home')}"></nav>

<main class="page-content" th:if="${profile}">

    <section class="hero">
        <div class="hero-avatar-wrap">
            <img th:src="@{/images/profile.jpg}" alt="Profile" class="hero-avatar"/>
        </div>
        <div class="hero-text">
            <h1 th:text="${profile.fullName}">Calistus Masinde Sirucha</h1>
            <h2 th:text="${profile.title}">Full-Stack Developer &amp; IT Services Consultant</h2>

            <div class="terminal-hero">
                <div class="terminal-line">
                    <span class="terminal-prompt">calistus@cmstechub:~$</span>
                    <span class="terminal-cmd" id="live-cmd"></span>
                    <span class="typewriter-caret">_</span>
                </div>
                <div class="terminal-output" id="live-output" style="opacity: 0; transition: opacity 0.2s ease;"></div>
            </div>

            <p class="hero-summary" th:text="${profile.summary}">Summary</p>

            <div class="hero-actions">
                <a th:href="@{/projects}" class="btn-primary">view projects →</a>
                <a th:href="@{/contact}"  class="btn-ghost">get in touch</a>
            </div>
        </div>
    </section>

    <section class="quick-links">
        <a th:href="@{/about}" class="quick-card">
            <span class="quick-icon">📖</span>
            <span class="quick-title">about</span>
            <span class="quick-desc">Who I am, what I study, what drives me.</span>
        </a>
        <a th:href="@{/projects}" class="quick-card">
            <span class="quick-icon">⚙️</span>
            <span class="quick-title">projects</span>
            <span class="quick-desc">5 live projects — problem → solution → stack.</span>
        </a>
        <a th:href="@{/skills}" class="quick-card">
            <span class="quick-icon">🛠️</span>
            <span class="quick-title">skills</span>
            <span class="quick-desc">Languages, frameworks, tools, and systems.</span>
        </a>
    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/matrix.js}"></script>
<script>
(function () {
    const cmdEl    = document.getElementById('live-cmd');
    const outEl    = document.getElementById('live-output');
    if (!cmdEl || !outEl) return;

    const sequence = [
        { cmd: 'whoami',                 out: 'calistus masinde sirucha' },
        { cmd: 'cat role.txt',           out: 'IT Specialist · Full-Stack Developer · IT Services Provider' },
        { cmd: 'cat study.txt',          out: 'BSc. Information Technology · Kaimosi Friends University' },
        { cmd: 'ls ~/projects',          out: 'CMSTechub  KAFU-Sports  CMS-Marketplace  Kali-Lab' },
        { cmd: 'cat stack.json',         out: 'Java · Spring Boot · React · PostgreSQL · Kali Linux' },
        { cmd: 'cat services.txt',       out: 'Web Dev · Networking · Hardware · Security · Tutoring' },
        { cmd: 'cat location.txt',       out: 'Kakamega, Kenya' },
        { cmd: 'cat status.txt',         out: 'available for freelance & collaboration' },
        { cmd: 'uptime',                 out: 'online · 4 live deployed apps · always learning' }
    ];

    let seqIndex = 0;
    let charIndex = 0;
    let phase = 'typing';

    function rand(min, max) { return min + Math.random() * (max - min); }

    function tick() {
        const step = sequence[seqIndex];

        if (phase === 'typing') {
            charIndex++;
            cmdEl.textContent = step.cmd.substring(0, charIndex);
            if (charIndex === step.cmd.length) {
                phase = 'pausing';
                setTimeout(tick, 400);
                return;
            }
            setTimeout(tick, rand(50, 90));
        } else if (phase === 'pausing') {
            outEl.textContent = step.out;
            outEl.style.opacity = '1';
            phase = 'showing';
            setTimeout(tick, 2400);
        } else if (phase === 'showing') {
            outEl.style.opacity = '0';
            phase = 'erasing';
            setTimeout(tick, 200);
        } else if (phase === 'erasing') {
            cmdEl.textContent = '';
            charIndex = 0;
            seqIndex = (seqIndex + 1) % sequence.length;
            phase = 'typing';
            setTimeout(tick, 300);
        }
    }

    cmdEl.textContent = '';
    outEl.textContent = '';
    outEl.style.opacity = '0';
    setTimeout(tick, 600);
})();
</script>
<div th:replace="~{fragments/layout :: scrollButtons}"></div>
</body>
</html>
