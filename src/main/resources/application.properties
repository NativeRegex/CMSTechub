spring.application.name=CMSTechub
server.port=${PORT:8080}

# Database (H2 in-memory — resets on restart, fine for portfolio)
spring.datasource.url=jdbc:h2:mem:resumedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=true

# Security — secure cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Trust Render's reverse proxy for HTTPS detection
server.forward-headers-strategy=framework

# Hide error details
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
